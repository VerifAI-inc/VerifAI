app = "verifai-backend"
primary_region = "iad"

[build]

[env]
  DEBUG = "False"
  ALLOWED_HOSTS = "verifai.tech,www.verifai.tech,verifai-backend.fly.dev"
  EMAIL_HOST_USER = "info.verifai@gmail.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "verifai_data"
  destination = "/app/media" 